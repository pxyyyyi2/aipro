<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- ✅ Mobile perfect viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>🌸 AI-PRO Assistant - Anime Edition</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <!-- 🌃 Animated Background -->
    <div class="anime-bg"></div>
    <div class="stars" id="starsContainer"></div>
    <div class="sakura-container" id="sakuraContainer"></div>

    <!-- 🎌 Welcome Screen -->
    <div id="welcomeScreen" class="welcome-screen">
        <div class="welcome-card">
            <div class="new-badge">
                <span>✨ NEW</span>
            </div>

            <h1 class="hero-title">
                <span class="gradient-text">AI-PRO</span>
                <span class="gradient-text">ASSISTANT</span>
            </h1>

            <p class="hero-subtitle">
                Introducing the next-gen<br>
                <span class="highlight">ChatGPT alternative!</span>
            </p>

            <div class="cute-mascot">🐱</div>

            <div class="welcome-form">
                <label class="input-label">Enter your name to begin</label>

                <input
                    type="text"
                    id="nameInput"
                    class="anime-input"
                    placeholder="Your name..."
                    autocomplete="name"
                    inputmode="text"
                >

                <button id="startBtn" class="anime-btn">
                    <span>Dive Into AI</span>
                </button>

                <div class="hashtag">#DiveIntoAI</div>
            </div>
        </div>
    </div>

    <!-- 🎮 Main App -->
    <div id="mainApp" class="app-container" style="display:none">

        <!-- Mobile overlay -->
        <div id="sidebarOverlay" class="sidebar-overlay"></div>

        <!-- 📂 Sidebar -->
        <aside id="sidebar" class="anime-sidebar" aria-label="Main Menu">
            <div class="sidebar-header">
                <div class="logo-container">
                    <div class="logo-icon">🌸</div>
                    <span class="logo-text">AI-PRO</span>
                </div>

                <button id="closeSidebarBtn" class="close-btn">✖</button>
            </div>

            <div class="user-card">
                <div class="user-avatar">
                    <span id="userInitial">U</span>
                    <div class="avatar-glow"></div>
                </div>
                <div class="user-info">
                    <span id="userNameSidebar" class="user-name">User</span>
                    <span class="user-status">
                        <span class="status-dot"></span>
                        Online
                    </span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <button class="nav-item active">💬 Chat</button>
                <button id="newChatBtn" class="nav-item">➕ New Chat</button>
            </nav>

            <div class="sidebar-footer">
                <button id="clearChatBtn" class="footer-btn">🗑 Clear Chat</button>
                <button id="logoutBtn" class="footer-btn">🚪 Logout</button>
            </div>
        </aside>

        <!-- 💬 Main Content -->
        <main class="main-content">

            <!-- Header -->
            <header class="app-header">
                <div class="header-left">
                    <button id="menuBtn" class="menu-btn">☰</button>
                    <h2 class="header-title">🤖 AI Assistant</h2>
                </div>

                <div class="header-right">
                    <span class="status-badge">
                        <span class="pulse-dot"></span>
                        AI Online
                    </span>
                </div>
            </header>

            <!-- Chat Area -->
            <div class="chat-area" role="log" aria-live="polite">
                <div id="chatMessages" class="messages-container"></div>
            </div>

            <!-- ✍️ Input Section -->
            <footer class="input-section">
                <div class="input-wrapper">
                    <button id="voiceBtn" class="action-btn">🎤</button>

                    <input
                        type="text"
                        id="messageInput"
                        class="message-input"
                        placeholder="Type your message…"
                        autocomplete="off"
                        inputmode="text"
                    >

                    <button id="imageBtn" class="action-btn">🖼</button>
                    <button id="sendBtn" class="send-btn">➤</button>
                </div>

                <!-- Image Prompt -->
                <div id="imagePanel" class="image-panel" style="display:none">
                    <input
                        type="text"
                        id="imagePrompt"
                        class="image-input"
                        placeholder="Describe image…"
                    >
                    <button id="generateImageBtn" class="generate-btn">Generate</button>
                </div>
            </footer>

        </main>
    </div>

    <!-- ⏳ Loading -->
    <div id="loadingIndicator" class="loading-overlay" style="display:none">
        <div class="loading-spinner">
            <div class="spinner-ring"></div>
            <div class="spinner-ring"></div>
            <div class="spinner-ring"></div>
        </div>
    </div>

    <!-- JS -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
